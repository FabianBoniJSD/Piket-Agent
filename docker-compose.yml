version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./piket.db
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - BASE_URL=${BASE_URL:-}
      - CORS_ORIGINS=http://localhost:3000
      - BACKEND_HEALTHCHECK_URL=${BACKEND_HEALTHCHECK_URL:-http://backend:8000/health}
    volumes:
      - piket_data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f \"$BACKEND_HEALTHCHECK_URL\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  piket_data:
